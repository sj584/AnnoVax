[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annovax"
version = "1.0.0"
description = "Protective antigen prediction from InterProScan annotations and protein language model embeddings under positive-unlabeled learning"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.12",
    # 3.x only: device="cuda" replaced the removed tree_method="gpu_hist".
    "xgboost>=3.2",
]

[project.optional-dependencies]
# Only needed to build embeddings yourself; prediction from published caches does not
# require torch at all.
embed = [
    "torch>=2.2",
    "transformers>=4.49",
    "sentence-transformers>=3.0",
    "biopython>=1.83",
    "esm>=3.1",
    "tqdm>=4.66",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
